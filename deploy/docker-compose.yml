  #     HESTIA_INFLUX_ORG: "helios"
  #     HESTIA_INFLUX_BUCKET: "hestia"
  #   command: ["python", "ca2influx.py"]

volumes:
  hestia_mqtt_data:
  hestia_mqtt_log:

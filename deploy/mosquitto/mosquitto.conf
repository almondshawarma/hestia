# Hestia MQTT broker (Mosquitto 2.x).
# anonymous on the LAN/Tailscale. Tailscale (WireGuard) is the encryption/authn boundary,
# same posture as the rest of Helios's http-over-Tailscale services.
# TODO before others get write access: enable password_file + per-topic ACLs so a room's
# node can only publish its own hestia/<area>/# topics.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Copy to secrets.yaml (gitignored) and fill in. NEVER commit real secrets!!!!!!!!!!
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
# IMPORTANT: use the Obelisk's LAN IP (e.g. 192.168.x.x), NOT its Tailscale IP.
# An ESP32 is a plain Wi-Fi device and is NOT on the tailnet, so 100.64.x.x is
# unreachable from it. Find the LAN IP on the Obelisk with:  ip -4 -o addr show scope global
mqtt_broker: "192.168.1.50"
